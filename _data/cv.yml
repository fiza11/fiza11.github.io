- title: Experience
  type: time_table
  contents:
    - title: Founding Machine Learning Engineer
      institution: Stimuler
      year: 2025 — present
      description:
        - Own the production speech stack end to end — automatic speech recognition, text-to-speech, and speech-to-speech — for a conversational English-fluency platform serving learners across India, Indonesia, and Latin America.
        - First author of the INTERSPEECH 2026 paper introducing entity- and disfluency-aware evaluation for accented conversational ASR, raising entity recall from 53–55% to 80–85% and filler recall from under 5% to 76–86%.
        - Fine-tuned and deployed region-specific LoRA adapters on audio language models for non-native English speech, served through vLLM at sub-second P95 latency.
        - Built and scaled a low-latency streaming text-to-speech service on Ray Serve and Anyscale, including multi-model GPU partitioning and autoscaling.
        - Designed the evaluation systems behind the stack — LLM-as-judge pipelines validated against human labels, error taxonomies, and metric hierarchies for conversational quality.

    - title: Research Fellow
      institution: M365 Research, Microsoft
      year: 2023 — 2025
      description:
        - Published research on intelligent monitoring and cloud operations, including first-author work at FSE Industry 2026 and co-authored papers at FSE 2024 and ICSE-SEIP 2024.
        - Developed foundation-model approaches to monitor configuration and incident prediction over large-scale operational telemetry.
        - Built statistical frameworks used to identify faulty, redundant, and misconfigured monitors across production cloud services.

    - title: Analyst
      institution: Goldman Sachs
      year: 2022 — 2023
      description:
        - Optimised a real-time graph pricer with market data subscription capabilities, improving data-driven pricing behaviour.
        - Worked on the Halo pricing model for rapid response to underlyer price changes in securitized derivatives.

    - title: Undergraduate Researcher
      institution: Machine Learning Lab, IIIT Hyderabad
      year: 2020 — 2022
      description:
        - Research student with Prof. Praveen Paruchuri and Prof. Sujit Gujar on privacy and generalization in deep reinforcement learning.
        - Developed a Privacy-Aware Inverse Reinforcement Learning analysis framework, published at AAAI 2022.

