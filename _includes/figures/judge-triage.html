<figure class="fh-figure">
  <p class="fh-example-turn">The judge and a human disagree on an example. Read it, and decide which of these happened:</p>
  <ol class="fh-axes">
    <li>
      <span class="fh-flow-step">the judge is wrong</span>
      <strong>Fix the judge</strong>
      <span>Give it the reference material it lacked, or tighten the instruction it misread.</span>
    </li>
    <li>
      <span class="fh-flow-step">the rubric is ambiguous</span>
      <strong>Fix the rubric</strong>
      <span>Define every point on the scale, with an example, until two people agree.</span>
    </li>
    <li>
      <span class="fh-flow-step">the human is wrong</span>
      <strong>Fix the labelling tool</strong>
      <span>Usually the labeller couldn't see context the judge could. Show it to them.</span>
    </li>
  </ol>
  <figcaption>Every disagreement has one of three causes, and only one of them is fixed by changing the judge.</figcaption>
</figure>
