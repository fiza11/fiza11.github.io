<figure class="fh-figure">
  <p class="fh-example-turn">Learner: <em>"I went to Bali last week with my sister."</em></p>
  <ol class="fh-axes">
    <li>
      <span class="fh-flow-step">fails: understand</span>
      <strong>"Oh nice, which ballet did you see?"</strong>
      <span>Warm, relevant to what it heard, sounds great. It just heard the wrong word.</span>
    </li>
    <li>
      <span class="fh-flow-step">fails: worth making</span>
      <strong>"I see. Can you tell me more about that?"</strong>
      <span>Understood perfectly and sounds fine, but it would fit any sentence at all. The conversation goes nowhere.</span>
    </li>
    <li>
      <span class="fh-flow-step">fails: sounds right</span>
      <strong>"Bali. With. Your sister. What did you. Do there?"</strong>
      <span>Understood, and the right question to ask, delivered in a flat, robotic cadence nobody wants to keep talking to.</span>
    </li>
  </ol>
  <figcaption>
    Three replies to the same turn, each passing two axes and failing the third. Averaged into one score they look alike; each needs a different fix.
